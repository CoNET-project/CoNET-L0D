# Hub 198.251.77.98 — spoke .45 (geth+beacon) + prod hub .82 overlay geth/beacon/udp.
# Pair with config/conet-l0d.45.lab-dual-beacon.toml on spoke.
# DHT-over-L0 to .82: overlay-dht-steer.sh PEER_PUBLIC_IP=216.225.202.82
# PEER_OVERLAY_VIP=100.64.0.7 (do not change .82 --nat). Geth docks overlay
# enode @100.64.0.7:8400; do not keep the public @216.225.202.82:8400 peer.

