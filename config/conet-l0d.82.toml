# Production L0 hub on 216.225.202.82 — inbound overlay for geth/beacon/udp.
# Existing EL/CL bind public IP; overlay VIP 100.64.0.7 via TUN + DNAT.
# Do not bind geth/beacon RPC to local_vip.
# Geth keeps public advertise (`--nat any` / public enode @216.225.202.82:8400).
# Other overlay geth dial `enode://f1e249c9…@100.64.0.7:8400` (scripts/l0-prod82-hub.env).
# Each new spoke needs its own [[peers]] row (per-port user PGP; do not reuse hub self-user.asc).

tun_name = "conet-l0"
overlay_cidr = "100.64.0.0/10"
local_vip = "100.64.0.7"
iptables_chain = "CONET_L0D"
state_path = "/home/peter/conet-l0d-lab/run/state.json"

[identity]
locator = "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792/p2p/geth"

# Lab spoke 74.208.224.45 @ 100.64.0.5 (geth :8400 + beacon :4200).
# Per-spoke user PGP — do not reuse hub self-user.asc here.
[[peers]]
locator = "web3://0xEF10752843cAC32C73DAb86658B8ab6E5667199B/p2p/geth"
vip = "100.64.0.5"
tcp_ports = [8400]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-geth-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-geth-route.asc"

[[peers]]
locator = "web3://0x3F84B8f11BF7886DCf0c902A3148cc2926E185dA/p2p/beacon"
vip = "100.64.0.5"
tcp_ports = [4200]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-beacon-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-beacon-route.asc"

# Lab hub 198.251.77.98 @ 100.64.0.6 — overlay geth + beacon TCP + discv5 UDP.
