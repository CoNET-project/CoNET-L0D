# Lab: production hub .82 as **proxy-server** L0 (TUN + proxies; apply listen-DNAT).
# IPv4 duplex from clients → TUN; non-IPv4 → [[l0.proxies]] upstream.
# Upstream targets = local geth :8400 + beacon :4200.
# Billing / offer match = mainWallet 0x66dC…; each accepted client line gets
# a fresh temporary listen identity.  The proxy can therefore multiplex .45
# and .98 on the same logical mainWallet:8400 / mainWallet:4200.
# Bounce only conet-l0d (hub first). Do not restart geth/beacon/validator unless authorized.

tun_name = "conet-l0"
overlay_cidr = "100.64.0.0/10"
local_vip = "100.64.0.7"
iptables_chain = "CONET_L0D"
state_path = "/home/peter/conet-l0d-lab/run/state-lab-proxy.json"

[identity]
locator = "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792/p2p/geth"

# Client .45 channel EOAs.
[[peers]]
locator = "web3://0xEF10752843cAC32C73DAb86658B8ab6E5667199B/p2p/geth"
vip = "100.64.0.5"
tcp_ports = [8400]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-geth-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-geth-route.asc"

[[peers]]
locator = "web3://0x3F84B8f11BF7886DCf0c902A3148cc2926E185dA/p2p/beacon"
vip = "100.64.0.5"
tcp_ports = [4200]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-beacon-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-45/peer-beacon-route.asc"

# Client .98 channel identities.  These entries identify the overlay VIP and
# peer PGP; billing/duplex matching still uses the hub main wallet above.
[[peers]]
locator = "web3://0x8a2b04C82B43447b69946b31BCCEa14ed29471f4/p2p/geth"
vip = "100.64.0.6"
tcp_ports = [8400]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-98/peer-geth-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-98/peer-geth-route.asc"

[[peers]]
locator = "web3://0x2Ae19d1f39445fFa218F540cdD6BDCAfBD68ca7b/p2p/beacon"
vip = "100.64.0.6"
tcp_ports = [4200]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-98/peer-beacon-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/spoke-98/peer-beacon-route.asc"

[l0]
enabled = true
rpc = "https://rpc1.conet.network"
address_pgp = "0x684b0ac760cEE9c9b85de36d69746420648Cf9e2"
entries = [
  "http://20ab90fe82d0e9e3.conet.network",
  "http://f8117e1568eeaed7.conet.network",
  "http://ae85a2aeec768225.conet.network",
]
listen_entries = [
  "http://f8117e1568eeaed7.conet.network",
  "http://ae85a2aeec768225.conet.network",
  "http://20ab90fe82d0e9e3.conet.network",
]
billing_eoa = "0x66dCB48ff905f5f5f3692f302da0A84e0265A792"
billing_eth_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.eth"

# Static channel listens remain available for non-proxy/static traffic.  Each
# accepted proxy line additionally creates its own temporary l0_listen EOA.
[[l0.channels]]
port = 8400
routing_eoa = "0x66dCB48ff905f5f5f3692f302da0A84e0265A792"
routing_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.key"
routing_eth_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.eth"
mailbox_route_pgp_file = "/home/peter/conet-l0d-lab/keys/geth/self-mailbox-route.asc"
listen_entries = [
  "http://f8117e1568eeaed7.conet.network",
  "http://ae85a2aeec768225.conet.network",
  "http://20ab90fe82d0e9e3.conet.network",
]

[[l0.channels]]
port = 4200
routing_eoa = "0x3048925d768694D4b95524DFB71b38e812D705Dd"
routing_key_file = "/home/peter/conet-l0d-lab/keys/beacon/routing.key"
routing_eth_key_file = "/home/peter/conet-l0d-lab/keys/beacon/routing.eth"
mailbox_route_pgp_file = "/home/peter/conet-l0d-lab/keys/beacon/self-mailbox-route.asc"
listen_entries = [
  "http://f8117e1568eeaed7.conet.network",
  "http://ae85a2aeec768225.conet.network",
  "http://20ab90fe82d0e9e3.conet.network",
]

# Proxies: raw-byte drain for non-IPv4. Hub still owns TUN for IPv4 clients.
# geth binds *:8400 → 127.0.0.1 OK. Lab beacon binds public IP only for :4200
# (ss: 216.225.202.82:4200), so do not use 127.0.0.1:4200; use listen-DNAT.
[[l0.proxies]]
host = "127.0.0.1"
port = 8400

[[l0.proxies]]
host = "216.225.202.82"
port = 4200
