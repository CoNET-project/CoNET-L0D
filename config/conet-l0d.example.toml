# Example overlay table. Copy to /etc/conet-l0d.toml and edit.
# The daemon owns TUN + iptables. Do not add a second operator iptables script.

tun_name = "conet-l0"
overlay_cidr = "100.64.0.0/10"
local_vip = "100.64.0.5"
iptables_chain = "CONET_L0D"
state_path = "/run/conet-l0d/state.json"
# Optional: never capture this uid (Prysm validator).
# validator_uid = 998

[identity]
# Peer locator, not ERC-4804 content. Routing EOA ≠ deposit keystore ≠ fee recipient.
locator = "web3://0x1111111111111111111111111111111111111111/p2p/geth"

[[peers]]
locator = "web3://HubTag.web3/p2p/geth"
vip = "100.64.0.1"
tcp_ports = [8400]

[[peers]]
locator = "web3://HubTag.web3/p2p/beacon"
vip = "100.64.0.1"
tcp_ports = [4200]
# udp_ports = [4300]

# P1 overlay /post client. Default off. When enabled and peer user+route PGP
# files plus an entry are set, the daemon encrypts, wraps, and POSTs.
# Inbound decrypt + TUN write-back is in-crate when routing_key_file is an
# OpenPGP secret cert. Listen HTTP+SSE is in-crate when enabled plus
# listen_entries, mailbox_route_pgp_file (this host's B route PUBLIC key),
# routing_eoa, routing_key_file, and routing_eth_key_file (hex secp256k1;
# must match routing_eoa; not OpenPGP). Listen is EIP-191 + SI
# { message, signMessage } base64. Lab stays off. Do not put Securitykey
# in a B-decryptable listen command.
# Encrypt envelope to peer user PGP, wrap { data, NoPush: true } to B route PGP,
# POST only { "data": outerArmor } to a healthy entry A ≠ B.
# Listen POST goes to entry C ≠ B. Do not invent a new SI command. Do not
# L0_ONLY lab may advertise the overlay vIP. Do not bind RPC/Engine to it.
# Outbound POST tries each [l0].entries host once; it does not fall back
# onto listen_entries.
#
# Optional per-port listen wallets (geth :8400, beacon TCP :4200, discv5 :4300).
# Each channel is a dedicated routing EOA + OpenPGP secret + EIP-191 key +
# mailbox B route public key + listen SSE. Outbound encrypts to the peer
# user PGP for that overlay port. Same VIP may have several [[peers]] rows.
# Empty [[l0.channels]] keeps one routing EOA for all overlay ports.
# :4300 is still overlay IPv4 (not SI udp_relay). listenKind stays "chat".
#
# [[l0.channels]]
# ports = [8400]
# routing_eoa = "0x<geth-routing-eoa>"
# routing_key_file = "/etc/conet-l0d/geth.key"
# routing_eth_key_file = "/etc/conet-l0d/geth.eth"
# mailbox_route_pgp_file = "/etc/conet-l0d/geth-mailbox-route.asc"
# listen_entries = ["https://<existing-guardian>.conet.network"]
#
# [l0]
# enabled = false
# rpc = "https://rpc1.conet.network"
# address_pgp = "0x684b0ac760cEE9c9b85de36d69746420648Cf9e2"
# entries = ["https://<existing-guardian>.conet.network"]
# listen_entries = ["https://<existing-guardian>.conet.network"]
# routing_eoa = "0x<dedicated-routing-eoa>"
# routing_key_file = "/etc/conet-l0d/routing.key"
# routing_eth_key_file = "/etc/conet-l0d/routing.eth"
# mailbox_route_pgp_file = "/etc/conet-l0d/self-mailbox-route.asc"
#
# Per-peer public key files (lab override; do not log contents):
# user_pgp_file = "/etc/conet-l0d/peer-user.asc"
# route_pgp_file = "/etc/conet-l0d/peer-route.asc"
