# CoNET Web3 Application Protocol runtime.
# Copy to /etc/conet-l0d.toml and choose a server or client-duplex profile.

state_path = "/run/conet-l0d/state.json"

[identity]
# Application locator. Routing EOA, billing wallet, and application origin
# identity are separate roles.
locator = "web3://0x1111111111111111111111111111111111111111/app"

[l0]
# Keep false until the route identities and existing Entry hosts below are
# configured.
enabled = false
rpc = "https://rpc1.conet.network"
address_pgp = "0x684b0ac760cEE9c9b85de36d69746420648Cf9e2"
route_register_url = "https://beamio.app/api/regiestChatRoute"

# Outbound POST uses Entry A. Mailbox listen uses Entry C. Both must differ
# from the destination mailbox B.
entries = []
listen_entries = []

# Main paid account for signed mailbox commands.
# billing_eoa = "0x<main-paid-wallet>"
# billing_eth_key_file = "/etc/conet-l0d/billing.eth"
# billing_pgp_file = "/etc/conet-l0d/billing-pgp.asc"

# Default communication identity for a single-port profile.
# routing_eoa = "0x<routing-eoa>"
# routing_key_file = "/etc/conet-l0d/routing-pgp.asc"
# routing_eth_key_file = "/etc/conet-l0d/routing.eth"
# mailbox_route_pgp_file = "/etc/conet-l0d/mailbox-route.asc"

# Linux client profile. Every target is exposed through 127.0.0.1.
# The same logical PORT may map to several remotes. Repeat for more lines:
#   --clientDuplex web3://0x<hub-a>:8400
#   --clientDuplex web3://0x<hub-b>:8400
#   --clientDuplex web3://0x<destination-wallet>:4200
client_duplex = [
  # "web3://0x<destination-wallet>:9443",
]

# Linux request/response server profile:
#
# [[l0.proxies]]
# host = "127.0.0.1"
# port = 8080

# Linux continuous-stream server profile:
#
# [[l0.proxy_duplex]]
# host = "127.0.0.1"
# port = 9443

# Multi-port servers use one communication identity per logical port because
# SI exclusive occupy is one line per listen wallet.
#
# [[l0.channels]]
# port = 9444
# routing_eoa = "0x<port-routing-eoa>"
# routing_key_file = "/etc/conet-l0d/9444-pgp.asc"
# routing_eth_key_file = "/etc/conet-l0d/9444.eth"
# mailbox_route_pgp_file = "/etc/conet-l0d/9444-mailbox-route.asc"
# listen_entries = ["https://<existing-entry-c>.conet.network"]

# Signed request/response gateway profile. Use a dedicated file when launching
# `conet-l0d gateway --config /etc/conet-l0d-gateway.toml`.
#
# [gateway]
# rpc = "https://rpc1.conet.network"
# upstream = "http://127.0.0.1:8080"
# listen_entries = ["https://<existing-entry-c>.conet.network"]
# post_entries = ["https://<existing-entry-a>.conet.network"]
# routing_eoa = "0x<gateway-eoa>"
# routing_key_file = "/etc/conet-web3-gateway/secrets/gateway-pgp.asc"
# routing_eth_key_file = "/etc/conet-web3-gateway/secrets/gateway.eth"
# mailbox_route_pgp_file = "/etc/conet-web3-gateway/secrets/mailbox-route.asc"
# allowed_methods = ["GET", "HEAD"]
# max_body_bytes = 8388608
# request_timeout_seconds = 15
