# Spoke 74.208.224.45 — lab overlay spoke toward prod hub .82 only (100.64.0.7).
# Channels: geth :8400 + beacon :4200. No :4300 / L0_DHT.
#
# The .82 proxy matches each request by mainWallet:port, then allocates a
# temporary listen identity for that line.  Therefore .45 and .98 may both
# request the same .82 mainWallet:8400 without sharing an SI occupy wallet.
# Bounce only conet-l0d (hub .82 first, then this host).

overlay_cidr = "100.64.0.0/10"
local_vip = "100.64.0.5"
state_path = "/home/peter/conet-l0d-lab/run/state-lab-dual.json"

[identity]
locator = "web3://0xEF10752843cAC32C73DAb86658B8ab6E5667199B/p2p/geth"

# --- prod proxy hub 216.225.202.82 @ 100.64.0.7 ---
[[peers]]
locator = "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792/p2p/geth"
vip = "100.64.0.7"
tcp_ports = [8400]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/82/peer-geth-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/peer-geth-route.asc"

[[peers]]
locator = "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792/p2p/beacon"
vip = "100.64.0.7"
tcp_ports = [4200]
user_pgp_file = "/home/peter/conet-l0d-lab/keys/82/peer-beacon-user.asc"
route_pgp_file = "/home/peter/conet-l0d-lab/keys/peer-beacon-route.asc"

[l0]
enabled = true
rpc = "https://rpc1.conet.network"
si_pool_from_contract = true
address_pgp = "0x684b0ac760cEE9c9b85de36d69746420648Cf9e2"
entries = []  # unused when si_pool_from_contract
listen_entries = []  # unused when si_pool_from_contract  # unused when si_pool_from_contract
routing_eoa = "0xEF10752843cAC32C73DAb86658B8ab6E5667199B"
routing_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.key"
routing_eth_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.eth"
mailbox_route_pgp_file = "/home/peter/conet-l0d-lab/keys/geth/self-mailbox-route.asc"
# billing may equal geth channel (exclusive occupy still uses distinct channel EOAs).
billing_eoa = "0xEF10752843cAC32C73DAb86658B8ab6E5667199B"
billing_eth_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.eth"

# Dial .82 mainWallet with an explicit duplex stream for geth.
# Stream-only dual hub: this host keeps public :8400/:4200 for .98.
# L0d therefore binds 127.0.0.1:18400/:14200 so geth/beacon can dial .82.
client_duplex = [
  "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792:8400@18400",
  "web3://0x66dCB48ff905f5f5f3692f302da0A84e0265A792:4200@14200",
]

[[l0.channels]]
port = 8400
routing_eoa = "0xEF10752843cAC32C73DAb86658B8ab6E5667199B"
routing_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.key"
routing_eth_key_file = "/home/peter/conet-l0d-lab/keys/geth/routing.eth"
mailbox_route_pgp_file = "/home/peter/conet-l0d-lab/keys/geth/self-mailbox-route.asc"
listen_entries = []  # unused when si_pool_from_contract  # unused when si_pool_from_contract

[[l0.channels]]
port = 4200
routing_eoa = "0x3F84B8f11BF7886DCf0c902A3148cc2926E185dA"
routing_key_file = "/home/peter/conet-l0d-lab/keys/beacon/routing.key"
routing_eth_key_file = "/home/peter/conet-l0d-lab/keys/beacon/routing.eth"
mailbox_route_pgp_file = "/home/peter/conet-l0d-lab/keys/beacon/self-mailbox-route.asc"
listen_entries = []  # unused when si_pool_from_contract  # unused when si_pool_from_contract
